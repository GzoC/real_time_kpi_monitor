services:
  monitor:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kpi-data:/data
    restart: unless-stopped

  broker:
    image: eclipse-mosquitto:2.0.22
    profiles: [mqtt]
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "health", "-m", "ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  consumer:
    build: .
    profiles: [mqtt]
    command: [mqtt-listen]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/kpi-mqtt.ready').read_text() == 'ready'"]
      interval: 2s
      timeout: 3s
      retries: 15
    environment:
      MQTT_HOST: broker
      MQTT_CLIENT_ID: kpi-compose-consumer
      MQTT_READY_FILE: /tmp/kpi-mqtt.ready
    volumes:
      - kpi-data:/data
    depends_on:
      monitor:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kpi-data:
  mqtt-data:
