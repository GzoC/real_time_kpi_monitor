[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-kpi-monitor"
version = "1.0.0"
description = "Auditable production OEE with explicit data coverage and MQTT telemetry."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "GzoC"}]
keywords = ["oee", "industrial-automation", "mqtt", "manufacturing", "data-quality"]
dependencies = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1", "pydantic>=2.14,<3", "paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-cov>=7,<8", "httpx2", "ruff>=0.17,<1", "amqtt>=0.11.4,<0.12", "build>=1.6,<2"]

[project.urls]
Repository = "https://github.com/GzoC/real_time_kpi_monitor"
Issues = "https://github.com/GzoC/real_time_kpi_monitor/issues"

[project.scripts]
kpi-monitor = "kpi_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kpi_monitor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
